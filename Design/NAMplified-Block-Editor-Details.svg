  <rect x="1342" y="600" width="140" height="4" rx="2" fill="#343c49"/><rect x="1342" y="600" width="74" height="4" rx="2" class="green"/>
  <text x="1342" y="640" class="body">All Buttons</text><text x="1482" y="640" class="small muted" text-anchor="end">off / on</text>
  <rect x="1342" y="655" width="140" height="4" rx="2" fill="#343c49"/><rect x="1342" y="655" width="52" height="4" rx="2" class="green"/>
  <text x="1342" y="696" class="small green">Bright switch · parallel blend</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#161a22"/><stop offset="1" stop-color="#0d1016"/></linearGradient>
    <linearGradient id="selected" x2="1" y2="1"><stop stop-color="#252c38"/><stop offset="1" stop-color="#1b202a"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".24"/></filter>
    <style>
      text{font-family:"Space Grotesk",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eef1f5}
      .muted{fill:#99a2b1}.dim{fill:#6f7886}.accent{fill:#ef8047}.green{fill:#66d6b2}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px}.title{font-size:28px;font-weight:700}.small{font-size:13px}.body{font-size:16px}.label{font-size:12px;font-weight:650;letter-spacing:.8px}
      .panel{fill:#1d222c;stroke:#343b48;stroke-width:1}.inner{fill:#131820;stroke:#343b48;stroke-width:1}.line{stroke:#353d4a;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="url(#bg)"/>
  <rect width="1600" height="4" fill="#66d6b2"/>
  <text x="48" y="47" class="eyebrow green">NAMPLIFIED</text>
  <text x="48" y="83" class="title">Signal Chain</text>
  <text x="48" y="108" class="small muted">Build the route on the left. Select any block to edit it in the detail panel.</text>
  <rect x="1248" y="35" width="304" height="48" rx="10" class="inner"/>
  <text x="1266" y="55" class="eyebrow muted">NAM ROUTING</text>
  <text x="1266" y="73" class="body">Series  ▾</text>
  <text x="48" y="157" class="eyebrow dim">01  /  ROUTE</text>
  <text x="1480" y="157" class="small muted" text-anchor="end">Drag blocks to reorder within a section</text>
  <path d="M90 230H1500" stroke="#4c5666" stroke-width="3" fill="none"/>
  <g filter="url(#shadow)">

  <text x="1330" y="919" class="label muted">PRE EQ</text><text x="1330" y="945" class="small">80 Hz – 12 kHz</text><text x="1330" y="974" class="label muted">POST EQ</text><text x="1330" y="995" class="small">50 Hz – 16 kHz</text>

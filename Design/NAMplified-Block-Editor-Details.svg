    <rect x="302" y="178" width="135" height="104" rx="12" fill="url(#selected)" stroke="#ef8047" stroke-width="2"/>
    <rect x="452" y="187" width="112" height="86" rx="12" class="panel"/><rect x="579" y="187" width="112" height="86" rx="12" class="panel"/>
    <rect x="706" y="187" width="112" height="86" rx="12" class="panel"/><rect x="833" y="187" width="112" height="86" rx="12" class="panel"/>
    <rect x="960" y="187" width="112" height="86" rx="12" class="panel"/><rect x="1087" y="187" width="112" height="86" rx="12" class="panel"/>
    <rect x="1214" y="187" width="112" height="86" rx="12" class="panel"/><rect x="1341" y="187" width="112" height="86" rx="12" class="panel"/>

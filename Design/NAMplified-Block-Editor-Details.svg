    <g transform="translate(440 585)"><circle r="51" fill="#121720" stroke="#394250" stroke-width="2"/><circle r="39" fill="#1f2631"/><path d="M0 -42L0 -28" stroke="#ef8047" stroke-width="4" stroke-linecap="round"/><circle r="3" class="green"/><text y="76" class="label muted" text-anchor="middle">INPUT</text><text y="96" class="small" text-anchor="middle">+7.5 dB</text></g>
    <g transform="translate(690 585)"><circle r="51" fill="#121720" stroke="#394250" stroke-width="2"/><circle r="39" fill="#1f2631"/><path d="M0 -42L0 -28" stroke="#ef8047" stroke-width="4" stroke-linecap="round"/><circle r="3" class="green"/><text y="76" class="label muted" text-anchor="middle">ATTACK</text><text y="96" class="small" text-anchor="middle">0.20 ms</text></g>
    <g transform="translate(940 585)"><circle r="51" fill="#121720" stroke="#394250" stroke-width="2"/><circle r="39" fill="#1f2631"/><path d="M0 -42L0 -28" stroke="#ef8047" stroke-width="4" stroke-linecap="round"/><circle r="3" class="green"/><text y="76" class="label muted" text-anchor="middle">RELEASE</text><text y="96" class="small" text-anchor="middle">250 ms</text></g>
    <g transform="translate(1190 585)"><circle r="51" fill="#121720" stroke="#394250" stroke-width="2"/><circle r="39" fill="#1f2631"/><path d="M0 -42L0 -28" stroke="#ef8047" stroke-width="4" stroke-linecap="round"/><circle r="3" class="green"/><text y="76" class="label muted" text-anchor="middle">RATIO</text><text y="96" class="small" text-anchor="middle">4:1 – 20:1</text></g>
  </g>
  <rect x="1320" y="515" width="184" height="190" rx="12" class="inner"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171b23"/><stop offset="1" stop-color="#0d1016"/></linearGradient>
    <style>
      text{font-family:"Space Grotesk",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eef1f5}
      .muted{fill:#99a2b1}.dim{fill:#6f7886}.accent{fill:#ef8047}.green{fill:#66d6b2}
      .eyebrow{font-size:13px;font-weight:700;letter-spacing:1.8px}.title{font-size:31px;font-weight:700}.small{font-size:14px}.body{font-size:18px}.label{font-size:13px;font-weight:650;letter-spacing:1px}
      .panel{fill:#1d222c;stroke:#343b48;stroke-width:1}.inner{fill:#131820;stroke:#343b48;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="4" fill="#ef8047"/>
  <text x="48" y="52" class="eyebrow green">NAMPLIFIED  /  PRE AMP EFFECT</text>
  <text x="48" y="96" class="title">Boost</text>
  <text x="48" y="124" class="small muted">Add level into the next block, then shape the tone before the NAM captures.</text>
